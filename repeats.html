  <script>
    const i18n = {
      en: {
        nav_shows:'Shows', nav_repeats:'Repeats', nav_identity:'Archive', nav_about:'About', nav_order:'Order clip',
        title:'Broadcast repeats',
        subtitle:'Recordings of BRIDGE TV: Project Restored broadcasts. The full archive is on VK Video.',
        vk_link:'Open VK Video archive',
        footer:'Presented by BM-PR. Not affiliated with BRIDGE MEDIA.'
      },
      ru: {
        nav_shows:'Программы', nav_repeats:'Повторы', nav_identity:'Архив', nav_about:'О телеканале', nav_order:'Заказать клип',
        title:'Повторы эфиров',
        subtitle:'Записи эфиров BRIDGE TV: Project Restored. Полный архив — во VK Video.',
        vk_link:'Открыть архив VK Video',
        footer:'Представлено командой BM-PR. Не имеет отношения к BRIDGE MEDIA.'
      }
    };
    function setLang(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes("'" + lang + "'")));
      localStorage.setItem('lang', lang);
    }
    setLang(localStorage.getItem('lang') || 'ru');
  </script>
  <script>
    /* Список повторов берётся из repeats.json (его обновляет GitHub Action после конца эфира).
       Если файл не загрузился — остаются плееры, вшитые в HTML. */
    (function () {
      var grid = document.querySelector('.page-repeats .grid');
      if (!grid || !window.fetch) return;
      fetch('repeats.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
        var items = (d && d.items || []).filter(function (x) {
          return typeof x.embed === 'string' && x.embed.indexOf('https://vkvideo.ru/video_ext.php?') === 0;
        });
        if (!items.length) return;
        grid.innerHTML = '';
        items.forEach(function (x, i) {
          var a = document.createElement('article'); a.className = 'repeat';
          var slot = document.createElement('div'); slot.className = 'player-slot';
          var f = document.createElement('iframe');
          f.src = x.embed; f.title = x.title || ('BRIDGE TV — повтор ' + (i + 1));
          f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;';
          f.setAttribute('allowfullscreen', ''); f.setAttribute('frameborder', '0');
          if (i > 1) f.loading = 'lazy';          /* первые два плеера грузим сразу */
          slot.appendChild(f);
          a.appendChild(slot);
          if (x.title || x.date) {              /* подписи только из VK: без «Повтор эфира №…» и общих фраз */
            var body = document.createElement('div'); body.className = 'repeat-body';
            if (x.title) { var h = document.createElement('h2'); h.textContent = x.title; body.appendChild(h); }
            if (x.date) {
              var p = document.createElement('p');
              p.textContent = new Date(x.date * 1000).toLocaleString(document.documentElement.lang === 'en' ? 'en-GB' : 'ru-RU',
                { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
              body.appendChild(p);
            }
            a.appendChild(body);
          }
          grid.appendChild(a);
        });
        if (typeof setLang === 'function') setLang(localStorage.getItem('lang') || 'ru');
      }).catch(function () {});
    })();
  </script>
