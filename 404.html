<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - BRIDGE TV Project Restored</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&subset=cyrillic,latin&display=swap" rel="stylesheet">
  <style>
    :root{--orange:#ff6a00;--black:#070707;--blue:#235fa8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fbfbfb,#d8d8d8);color:#222}
    a{color:inherit;text-decoration:none}
    .page{width:min(900px,calc(100% - 24px));margin:14px auto 24px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
    header{background:var(--black);padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .logo img{height:48px}
    .lang{color:#fff;display:flex;align-items:center;gap:6px;font-size:14px}
    .lang-btn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:3px;padding:2px 8px;font-size:13px;cursor:pointer;opacity:.7}
    .lang-btn.active{opacity:1;border-color:#fff;font-weight:700}
    main{padding:42px 28px 48px;text-align:center}
    .code{font-size:82px;font-weight:900;line-height:1;color:var(--orange);letter-spacing:-3px}
    h1{margin:12px 0 10px;font-size:28px}
    p{max-width:560px;margin:0 auto 24px;line-height:1.5;color:#666}
    .btn{display:inline-block;background:var(--orange);color:#fff;border-radius:4px;padding:11px 18px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.16)}
    .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;color:var(--blue);font-weight:700}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="index.html"><img src="logo.png" alt="BRIDGE TV"></a>
      <div class="lang">language:
        <button class="lang-btn active" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="lang-btn" onclick="setLang('ru')">🇷🇺 RU</button>
      </div>
    </header>
    <main>
      <div class="code">404</div>
      <h1 data-i18n="title">Эта частота молчит</h1>
      <p data-i18n="text">Страница не найдена или уже ушла из эфира. Вернитесь на главную, к программам или откройте повторы.</p>
      <a class="btn" href="index.html" data-i18n="home">На главную</a>
      <div class="links">
        <a href="shows.html" data-i18n="nav_shows">Программы</a>
        <a href="repeats.html" data-i18n="nav_repeats">Повторы</a>
        <a href="identity.html" data-i18n="nav_identity">Архив</a>
        <a href="order.html" data-i18n="nav_order">Заказать клип</a>
      </div>
    </main>
  </div>
  <script>
    const i18n = {
      en: {
        title:'This frequency is silent',
        text:'The page was not found or has already left the air. Return home, browse shows, or open repeats.',
        home:'Go home',
        nav_shows:'Shows', nav_repeats:'Repeats', nav_identity:'Archive', nav_order:'Order clip'
      },
      ru: {
        title:'Эта частота молчит',
        text:'Страница не найдена или уже ушла из эфира. Вернитесь на главную, к программам или откройте повторы.',
        home:'На главную',
        nav_shows:'Программы', nav_repeats:'Повторы', nav_identity:'Архив', nav_order:'Заказать клип'
      }
    };
    function setLang(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes("'" + lang + "'")));
      localStorage.setItem('lang', lang);
    }
    setLang(localStorage.getItem('lang') || 'ru');
  </script>
</body>
</html>
