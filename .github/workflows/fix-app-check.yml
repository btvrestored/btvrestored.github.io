name: Apply Firebase App Check

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-app-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Firebase App Check to compat web pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          site_key = '6Letro4tAAAAAO_hk7XQrWX0OG6GjPARsB2U0uwJ'
          # These pages use the Firebase compat SDK. index.html currently uses a
          # different Firebase initialization pattern, so do not inject compat
          # App Check code into it automatically.
          files = [
              Path('admin/index.html'),
              Path('admin/chat.html'),
              Path('admin/receive.html'),
          ]
          appcheck_script = '<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-check-compat.js"></script>'
          appcheck_init = f"""\n  const appCheck = firebase.appCheck();\n  appCheck.activate('{site_key}', true);\n"""

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              if 'firebase-app-check-compat.js' not in text:
                  marker = '<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>'
                  if marker in text:
                      text = text.replace(marker, marker + '\n' + appcheck_script, 1)
                  else:
                      marker = '<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>'
                      if marker not in text:
                          raise SystemExit(f'Firebase compat SDK marker not found in {path}')
                      text = text.replace(marker, marker + '\n' + appcheck_script, 1)

              if 'appCheck.activate(' not in text:
                  marker = 'firebase.initializeApp(firebaseConfig);'
                  if marker not in text:
                      raise SystemExit(f'firebase.initializeApp marker not found in {path}')
                  text = text.replace(marker, marker + appcheck_init, 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html admin/chat.html admin/receive.html .github/workflows/fix-app-check.yml
          git rm .github/workflows/fix-app-check.yml
          git commit -m "fix: initialize Firebase App Check on admin pages"
          git push
