name: Apply Firebase App Check

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-app-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Firebase App Check to web pages
        env:
          SITE_KEY: 6Letro4tAAAAAO_hk7XQrWX0OG6GjPARsB2U0uwJ
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site_key = '6Letro4tAAAAAO_hk7XQrWX0OG6GjPARsB2U0uwJ'
          files = [
              Path('index.html'),
              Path('admin/index.html'),
              Path('admin/chat.html'),
              Path('admin/receive.html'),
          ]
          appcheck_script = '<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-check-compat.js"></script>'
          appcheck_init = f"\n  const appCheck = firebase.appCheck();\n  appCheck.activate('{site_key}', true);\n"

          def find_matching_paren(text, opening):
              depth = 0
              quote = None
              escape = False
              for i in range(opening, len(text)):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          return i
              return None

          def add_appcheck(text, path):
              original = text

              if 'firebase-app-check-compat.js' not in text:
                  app_marker = re.search(
                      r'<script[^>]+src=["\']https://www\.gstatic\.com/firebasejs/[^"\']+/firebase-app-compat\.js["\'][^>]*></script>',
                      text,
                      re.I,
                  )
                  if not app_marker:
                      raise SystemExit(f'Firebase app compat SDK marker not found in {path}')
                  text = text[:app_marker.end()] + '\n' + appcheck_script + text[app_marker.end():]

              if 'appCheck.activate(' not in text:
                  init_match = re.search(r'firebase\.initializeApp\s*\(', text)
                  if not init_match:
                      init_match = re.search(r'(?<![\w$.])initializeApp\s*\(', text)
                  if not init_match:
                      raise SystemExit(f'Firebase initialization call not found in {path}')

                  opening = text.find('(', init_match.start())
                  end = find_matching_paren(text, opening)
                  if end is None:
                      raise SystemExit(f'Could not find end of Firebase initialization call in {path}')

                  text = text[:end + 1] + appcheck_init + text[end + 1:]

              return text, text != original

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              text, did_change = add_appcheck(text, path)
              if did_change:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin/index.html admin/chat.html admin/receive.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: initialize Firebase App Check on web pages"
          git push
