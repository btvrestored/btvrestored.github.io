<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 10 зрителей - BRIDGE TV Project Restored</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&subset=cyrillic,latin&display=swap" rel="stylesheet">
  <style>
    :root{--black:#070707;--orange:#ff6a00;--blue:#235fa8;--line:#e6e6e6}
    *{box-sizing:border-box}
    body{margin:0;font-family:Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fbfbfb,#d8d8d8);color:#222}
    a{color:inherit;text-decoration:none}
    .page{width:min(1000px,calc(100% - 24px));margin:14px auto 24px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
    header{background:var(--black);padding:18px 22px}
    .logo img{height:48px}
    nav{display:flex;justify-content:center;gap:32px;padding:16px 14px 15px;border-bottom:1px solid #ededed;font-size:16px;flex-wrap:wrap}
    nav a.active{color:var(--orange);font-weight:700}
    main{padding:32px}
    h1{margin:0 0 8px;font-size:30px;font-weight:900;letter-spacing:-.5px}
    .subtitle{margin:0 0 24px;color:#777}
    .board{display:grid;gap:12px}
    .track{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}
    .pos{font-size:22px;font-weight:900;color:var(--orange);text-align:center}
    .title{font-weight:900}
    .artist{font-size:13px;color:#777;margin-top:2px}
    .votes{font-size:12px;color:#777;text-align:right;margin-bottom:6px}
    button{border:0;border-radius:4px;background:var(--orange);color:#fff;padding:8px 12px;font-weight:700;cursor:pointer;font-family:inherit}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-top:16px;color:#666;min-height:20px}
    footer{padding:16px 18px 22px;color:#777;font-size:13px;border-top:1px solid #eee}
    @media(max-width:680px){main{padding:22px 18px}.track{grid-template-columns:38px 1fr}.action{grid-column:2}}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="logo" href="index.html"><img src="logo.png" alt="BRIDGE TV"></a></header>
    <nav>
      <a href="shows.html">Программы</a>
      <a class="active" href="top10.html">Top 10</a>
      <a href="identity.html">Архив</a>
      <a href="about.html">О телеканале</a>
      <a href="order.html">Заказать клип</a>
    </nav>
    <main>
      <h1>Top 10 зрителей</h1>
      <p class="subtitle">Голосуйте за треки. Один голос с браузера сохраняется локально, чтобы чарт оставался честнее.</p>
      <div class="board" id="board"></div>
      <div class="status" id="status"></div>
    </main>
    <footer>Presented by BM-PR. Not affiated with BRIDGE MEDIA.</footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyBb10uNIY5YyjVPIbpKxZEMEYQF_flTDrA",
      authDomain: "testermode-1.firebaseapp.com",
      databaseURL: "https://testermode-1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "testermode-1",
      storageBucket: "testermode-1.firebasestorage.app",
      messagingSenderId: "881614741843",
      appId: "1:881614741843:web:5b5b037229b32618f5c1a6"
    });
    const db = firebase.database();
    const votedKey = 'btv_top10_voted_track';
    const tracks = [
      ['robert-miles-children', 'Robert Miles', 'Children'],
      ['atb-9pm', 'ATB', '9 PM (Till I Come)'],
      ['moby-natural-blues', 'Moby', 'Natural Blues'],
      ['roxette-listen-to-your-heart', 'Roxette', 'Listen To Your Heart'],
      ['depeche-mode-enjoy-the-silence', 'Depeche Mode', 'Enjoy The Silence'],
      ['daft-punk-around-the-world', 'Daft Punk', 'Around The World'],
      ['queen-show-must-go-on', 'Queen', 'The Show Must Go On'],
      ['a-ha-take-on-me', 'a-ha', 'Take On Me'],
      ['nirvana-smells-like-teen-spirit', 'Nirvana', 'Smells Like Teen Spirit'],
      ['pet-shop-boys-go-west', 'Pet Shop Boys', 'Go West']
    ];
    let votes = {};
    db.ref('top10Votes').on('value', snap => {
      votes = snap.val() || {};
      render();
    });
    function render() {
      const voted = localStorage.getItem(votedKey);
      const rows = tracks
        .map(t => ({ id:t[0], artist:t[1], title:t[2], votes:Number(votes[t[0]] || 0) }))
        .sort((a,b) => b.votes - a.votes || tracks.findIndex(t => t[0] === a.id) - tracks.findIndex(t => t[0] === b.id));
      document.getElementById('board').innerHTML = rows.map((t, i) => `
        <div class="track">
          <div class="pos">${i + 1}</div>
          <div><div class="title">${esc(t.title)}</div><div class="artist">${esc(t.artist)}</div></div>
          <div class="action"><div class="votes">${t.votes} голосов</div><button onclick="vote('${t.id}')" ${voted ? 'disabled' : ''}>Голосовать</button></div>
        </div>
      `).join('');
      if (voted) document.getElementById('status').textContent = 'Ваш голос учтён.';
    }
    function vote(id) {
      if (localStorage.getItem(votedKey)) return;
      db.ref('top10Votes/' + id).transaction(v => Number(v || 0) + 1)
        .then(() => {
          localStorage.setItem(votedKey, id);
          document.getElementById('status').textContent = 'Спасибо, голос принят.';
          render();
        });
    }
    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    render();
  </script>
</body>
</html>
